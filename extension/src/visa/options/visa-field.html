<!-- DSTrack URL -->
<div class="mt-5">
	<label for="DSTrackUrl" class="text-xs font-semibold uppercase tracking-wide text-slate-400"> Visa Track URL </label>

	<input
		id="DSTrackUrl"
		type="url"
		autocomplete="url"
		spellcheck="false"
		placeholder="https://visa-track.example.com"
		class="mt-2 w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm text-white placeholder:text-slate-600 transition focus:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-300/30"
	/>
</div>

<!-- Asesor -->
<div class="mt-5">
	<label for="asesor" class="text-xs font-semibold uppercase tracking-wide text-slate-400"> Asesor </label>

	<input
		id="asesor"
		type="text"
		autocomplete="asesor"
		placeholder="Jefferson Gutierritos"
		class="mt-2 w-full rounded-2xl border border-white/10 bg-white/5 px-4 py-3 text-sm text-white placeholder:text-slate-600 transition focus:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-300/30"
	/>
</div>
