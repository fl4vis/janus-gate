<!doctype html>
<html class="no-scrollbar">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <script src="./tailwind_cdn_548.js"></script>
    <style>
        :root {
            --text-xs: 0.55rem;
            --text-sm: 0.65rem;
            --text-base: 0.775rem;
            --text-lg: 0.9rem;
            --text-xl: 1.025rem;
            --text-2xl: 1.15rem;
            --text-3xl: 1.4rem;
        }

        /* scrollbar */
        #status::-webkit-scrollbar {
            width: 6px;
        }

        #status::-webkit-scrollbar-track {
            background: transparent;
        }

        #status::-webkit-scrollbar-thumb {
            background-color: rgba(148, 163, 184, 0.4);
            /* slate-400 at 40% */
            border-radius: 9999px;
        }

        #status {
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, 0.4) transparent;
        }

        .no-scrollbar {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body
    class="bg-gradient-to-br from-slate-950 via-slate-900 to-slate-950 text-slate-100 font-['Space_Grotesk',sans-serif]">
    <div class="min-w-[14rem] max-w-sm mx-auto px-3 py-4">
        <div
            class="relative overflow-hidden rounded-3xl border border-white/10 bg-white/5 shadow-2xl shadow-blue-900/30">
            <div class="absolute -top-16 -right-20 h-48 w-48 rounded-full bg-blue-500/30 blur-3xl"></div>
            <div class="relative p-4 space-y-4">
                <header class="space-y-2">
                    <p
                        class="inline-flex items-center gap-2 rounded-full bg-blue-500/10 px-3 py-1 text-xs font-semibold uppercase tracking-wide text-blue-300">
                        <span class="h-2 w-2 rounded-full bg-blue-400 animate-pulse"></span>
                        Janus Gate
                        <span><img src="./icons/janus_icon32.png" alt=""></span>
                    </p>
                </header>

                <section class="space-y-4">
                    <div class="flex items-center justify-between">
                        <button id="nodesTitle"
                            class="flex items-center gap-2 text-sm font-semibold text-slate-200 hover:text-white transition-colors group">
                            <span>Nodes</span>
                            <svg id="nodesChevron"
                                class="h-4 w-4 text-slate-400 transition-transform duration-200 group-hover:text-slate-200"
                                xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor"
                                stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                            </svg>
                        </button>
                        <button id="nodes"
                            class="inline-flex items-center gap-2 rounded-full border border-blue-400/60 bg-blue-500/20 px-3 py-1 text-xs font-semibold text-blue-100 transition hover:bg-blue-500/30 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-300">
                            <span class="h-2 w-2 rounded-full bg-blue-300" id="nodesIndicator"></span>
                            <span id="nodesLabel">Refresh</span>
                        </button>
                    </div>
                    <div id="status"
                        class="hidden space-y-2 rounded-2xl bg-slate-900/50 p-4 text-sm text-slate-200 max-h-64 overflow-y-auto"
                        aria-live="polite">
                        <p class="text-slate-400">No nodes loaded yet.</p>
                    </div>
                    <p id="nodesMeta" class="text-xs text-slate-400">Nodes update automatically when connections change.
                    </p>
                </section>

                <section class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h2 class="text-sm font-semibold text-slate-200">Proxy Session</h2>
                        <span id="connectionBadge"
                            class="text-xs font-semibold uppercase tracking-wide text-amber-200">Idle</span>
                    </div>
                    <div class="grid gap-3 sm:grid-cols-2">
                        <label class="text-xs font-semibold uppercase tracking-wide text-slate-400">
                            IP
                            <input id="host" readonly
                                class="mt-1 w-full rounded-2xl border border-white/10 bg-white/5 px-2 py-1 text-sm text-white placeholder:text-slate-500 focus:border-blue-400 focus:outline-none focus:ring-2 focus:ring-blue-300" />
                        </label>
                        <label class="text-xs font-semibold uppercase tracking-wide text-slate-400">
                            Port
                            <input id="port" value="1080" readonly
                                class="mt-1 w-full rounded-2xl border border-white/10 bg-white/5 px-2 py-1 text-sm text-white" />
                        </label>
                    </div>
                    <div class="flex flex-col gap-2 sm:flex-row mt-6">
                        <button id="connect"
                            class="flex-1 rounded-2xl bg-blue-500/80 px-3 py-2 text-sm font-semibold text-white shadow-lg shadow-blue-900/40 transition hover:bg-blue-500 focus:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-offset-slate-950 focus-visible:ring-blue-300">
                            Connect
                        </button>
                        <button id="disconnect"
                            class="flex-1 rounded-2xl border border-white/10 bg-white/5 px-4 py-2 text-sm font-semibold text-slate-200 transition hover:bg-white/10 focus:outline-none focus-visible:ring-2 focus-visible:ring-blue-200/40">
                            Disconnect
                        </button>
                    </div>
                    <div id="proxyStatus" class="text-sm text-slate-300" aria-live="polite"></div>
                </section>
            </div>
        </div>
    </div>

    <script type="module" src="./popup/popup.js"></script>
</body>

</html>
